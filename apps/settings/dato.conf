# Dato, application container.
#
# Sandboxed, but `defaults` resolves the bare bundle id into the container.
#
# enabledCalendars is deliberately absent. It holds EventKit calendar UUIDs
# that macOS generates per machine, so copying them elsewhere selects nothing.
# Pick the calendars again by hand after installing.
#
# Also absent, on purpose: the settings window frame and menu bar item
# position (tied to this display), SS_launchCount and SS_firstLaunchDate
# (which would churn on every launch), and the SS_App_runOnce__* and
# SS_ShowForAppRuns_* flags that record which tips have been dismissed.

app    Dato
domain com.sindresorhus.Dato

key _respectNaturalScrolling
key calendarEventsDayCount
key iconInMenuBar
key menu_eventDetails_showTimeZones
key menu_positionedBelowMenuBarItem
key pinWindow
key resizableWindowHeight
key showDateInMenuBar
key showMonthInMenuBar
key showTimeInMenuBar
key showWeekDayInMenuBar
key timeZonesInMenu
key upcomingEventInMenuBar_onlyEventsWithStatus
key useGoogleMaps
