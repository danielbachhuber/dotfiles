# Dato, group container.
#
# The time zone list is stored twice: timeZonesInMenu in the application
# container and sharedTimeZones here, which is what the widget reads. Both are
# captured so a restored machine agrees with itself.
#
# `defaults` cannot resolve this group id by name, so the domain is the plist
# path. ~ is expanded when the file is read.

app    Dato
domain ~/Library/Group Containers/group.com.sindresorhus.Dato/Library/Preferences/group.com.sindresorhus.Dato.plist

key sharedTimeZones
